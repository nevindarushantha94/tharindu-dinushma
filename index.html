<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tharindu &amp; Dinushma · Wedding Invitation</title>
  <meta name="description" content="Together with their families, Tharindu and Dinushma joyfully invite you to celebrate their wedding on 5 December 2026.">
  <meta name="theme-color" content="#faf7ef">
  <link rel="canonical" href="/">

  <!-- Social sharing. The three image/URL values below are made absolute by:
       node scripts/set-site-url.js https://your-domain.com/   (see README) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tharindu &amp; Dinushma">
  <meta property="og:title" content="Tharindu &amp; Dinushma · Wedding Invitation">
  <meta property="og:description" content="Together with their families, Tharindu and Dinushma joyfully invite you to celebrate their wedding — Saturday, 05 December 2026, Ranowell Hotel, Kochchikade.">
  <meta property="og:url" content="/">
  <meta property="og:image" content="/assets/social/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Tharindu &amp; Dinushma wedding invitation — a wax-sealed envelope with the T&amp;D monogram">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tharindu &amp; Dinushma · Wedding Invitation">
  <meta name="twitter:description" content="Together with their families, Tharindu and Dinushma joyfully invite you to celebrate their wedding — Saturday, 05 December 2026.">
  <meta name="twitter:image" content="/assets/social/og-image.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 28C6 14 16 5 28 4 27 17 18 27 4 28Z' fill='%237d9878'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Flags: js enabled; show the opening video unless the link targets a section (#rsvp etc.) -->
  <script>document.documentElement.className = "js" + (location.hash ? "" : " intro-active");</script>
  <script src="js/config.js"></script>
  <script src="js/logic.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>

  <!-- ================= BACKGROUND VIDEO (looping, low opacity) =================
       File: assets/video/background.mp4  (set in js/config.js → background) -->
  <div id="bg" class="bg" aria-hidden="true">
    <video id="bgVideo" class="bg__video" muted loop playsinline preload="none"
           disablepictureinpicture disableremoteplayback tabindex="-1"></video>
    <div class="bg__veil"></div>
  </div>

  <!-- ================= OPENING (poster + tap to open) =================
       Poster and video files are set in js/config.js → video.
       The <video> has NO src and NO autoplay: js/main.js only loads and
       plays it after the guest taps "Tap to Open Invitation". -->
  <div id="intro" class="intro" role="dialog" aria-label="Wedding invitation — tap to open">
    <div class="intro__stage">
      <video id="introVideo" class="intro__video" muted playsinline preload="none"
             disablepictureinpicture disableremoteplayback tabindex="-1" aria-hidden="true"></video>

      <!-- Shown on top of the video until the video is actually rendering frames -->
      <img id="introPoster" class="intro__poster" alt="" decoding="async" fetchpriority="high">

      <!-- Shown only when the poster is missing, or the video cannot play -->
      <div class="intro__fallback" aria-hidden="true">
        <div class="intro__fallback-names">
          <span class="script" data-cfg="couple.first"></span>
          <span class="script and" data-cfg="couple.and"></span>
          <span class="script" data-cfg="couple.second"></span>
        </div>
      </div>

      <button id="introOpen" class="btn btn--ghost intro__open" type="button">
        <span class="intro__open-label">Tap to Open Invitation</span>
      </button>
      <button id="introSkip" class="intro__skip" type="button">Skip</button>
    </div>
  </div>

  <noscript><p class="noscript">Please enable JavaScript to view this invitation.</p></noscript>

  <!-- ================= INVITATION ================= -->
  <main id="invitation">

    <!-- 1 · Hero -->
    <section class="hero" id="top">

      <div class="hero__inner">
        <p class="eyebrow reveal" style="--d:.1s" data-cfg="text.eyebrow"></p>

        <!-- The couple's photograph (assets/photos/couple.jpg — set in js/config.js → photo) -->
        <figure class="portrait reveal" id="portrait" style="--d:.35s">
          <div class="portrait__mat">
            <div class="portrait__photo">
              <img id="portraitImg" src="assets/photos/couple.jpg" width="853" height="1280" alt="Tharindu and Dinushma, smiling at each other and holding hands" decoding="async">
            </div>
          </div>
        </figure>

        <h1 class="names">
          <span class="script name reveal" style="--d:.8s" data-cfg="couple.first"></span>
          <span class="script and reveal" style="--d:1.05s" data-cfg="couple.and"></span>
          <span class="script name reveal" style="--d:1.25s" data-cfg="couple.second"></span>
        </h1>
        <p class="lead reveal" style="--d:1.65s" data-cfg="text.invite"></p>
        <p class="hero__date reveal" style="--d:1.9s" id="heroDate"></p>
      </div>

      <a class="swipe reveal" style="--d:2.3s" href="#details" aria-label="Swipe down to see the wedding details">
        <span class="swipe__text" data-cfg="text.swipe"></span>
        <svg class="swipe__arrow" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 4v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </section>

    <!-- 2 · Details -->
    <section class="section details" id="details">

      <p class="eyebrow reveal" data-cfg="text.detailsEyebrow"></p>

      <div class="date reveal" style="--d:.15s">
        <span class="date__side"><span id="dWeekday"></span></span>
        <span class="date__day"><span id="dDay"></span><sup id="dSuffix"></sup></span>
        <span class="date__side"><span id="dMonth"></span></span>
      </div>
      <p class="year reveal" style="--d:.25s" id="dYear"></p>

      <p class="time reveal" style="--d:.35s" data-cfg="event.timeText"></p>

      <div class="divider reveal" style="--d:.45s" aria-hidden="true"><img src="assets/botanical/divider.svg" alt="" loading="lazy"></div>

      <h2 class="venue reveal" style="--d:.55s" data-cfg="venue.name"></h2>
      <p class="area reveal" style="--d:.62s" data-cfg="venue.area"></p>

      <a id="mapLink" class="btn reveal" style="--d:.75s" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        <span data-cfg="venue.mapsLabel"></span>
      </a>
    </section>

    <!-- 3 · Countdown -->
    <section class="section countdown" id="countdown-section">
      <p class="eyebrow reveal" data-cfg="text.countdownEyebrow"></p>
      <h2 class="script title reveal" style="--d:.12s" data-cfg="text.countdownTitle"></h2>

      <div id="countdown" class="cd reveal" style="--d:.25s" role="timer" aria-live="off">
        <div class="cd__item"><span class="cd__num" data-unit="days">00</span><span class="cd__label">Days</span></div>
        <div class="cd__item"><span class="cd__num" data-unit="hours">00</span><span class="cd__label">Hours</span></div>
        <div class="cd__item"><span class="cd__num" data-unit="minutes">00</span><span class="cd__label">Minutes</span></div>
        <div class="cd__item"><span class="cd__num" data-unit="seconds">00</span><span class="cd__label">Seconds</span></div>
      </div>
      <p id="countdownDone" class="cd__done" data-cfg="text.countdownDone" hidden></p>
    </section>

    <!-- 4 · RSVP -->
    <section class="section rsvp" id="rsvp">

      <p class="eyebrow reveal" data-cfg="text.rsvpEyebrow"></p>
      <h2 class="script title reveal" style="--d:.12s" data-cfg="text.rsvpTitle"></h2>
      <p class="deadline reveal" style="--d:.2s" data-cfg="rsvp.deadlineText"></p>

      <form id="rsvpForm" class="form reveal" style="--d:.3s" novalidate autocomplete="on">
        <div class="field">
          <label for="guestName">Your name</label>
          <input id="guestName" name="name" type="text" maxlength="60" autocomplete="name" placeholder="Full name" required>
        </div>

        <fieldset class="field">
          <legend>Attendance</legend>
          <div class="choices choices--stack">
            <label class="choice choice--card">
              <input type="radio" name="attend" value="yes"><span>Joyfully Accept</span>
            </label>
            <label class="choice choice--card">
              <input type="radio" name="attend" value="no"><span>Regretfully Decline</span>
            </label>
          </div>
        </fieldset>

        <div class="field">
          <label for="guestMessage" data-cfg="text.messageLabel">A Little Message</label>
          <textarea id="guestMessage" name="message" rows="3" maxlength="500" placeholder="Leave a little message for the couple..."></textarea>
        </div>

        <fieldset class="field">
          <legend>Send your reply to</legend>
          <div id="rsvpTo" class="choices choices--pair"></div>
        </fieldset>

        <button class="btn btn--solid btn--wide" type="submit">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M20 11.6A8 8 0 0 1 8.2 18.7L4 20l1.3-4A8 8 0 1 1 20 11.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.2 8.6c.3 2.9 2.500 5.200 5.600 5.700l1.100-1.300-1.900-1-.9.800c-1-.4-1.800-1.200-2.200-2.200l.8-.9-1-1.900-1.500.8Z" fill="currentColor"/></svg>
          Send via WhatsApp
        </button>
        <p id="rsvpStatus" class="rsvp__status" role="status" aria-live="polite"></p>
        <p class="fineprint">This opens WhatsApp with your reply ready to send.</p>
      </form>

      <!-- Contact area (filled from js/config.js → rsvp.contacts) -->
      <div class="contact">
        <div class="divider reveal" aria-hidden="true"><img src="assets/botanical/divider.svg" alt="" loading="lazy"></div>
        <p class="eyebrow reveal" data-cfg="text.contactEyebrow"></p>
        <div id="contactGrid" class="contact__grid"></div>
      </div>
    </section>

    <!-- 5 · Thank you -->
    <section class="section final" id="thanks">
      <div class="divider reveal" aria-hidden="true"><img src="assets/botanical/divider.svg" alt="" loading="lazy"></div>
      <p class="thanks reveal" style="--d:.15s" data-cfg="text.thanks"></p>
      <p class="withlove reveal" style="--d:.35s" data-cfg="text.withLove"></p>
      <p class="script signoff reveal" style="--d:.55s"><span data-cfg="couple.first"></span> &amp; <span data-cfg="couple.second"></span></p>

      <p id="credit" class="credit"></p>
    </section>
  </main>

</body>
</html>
